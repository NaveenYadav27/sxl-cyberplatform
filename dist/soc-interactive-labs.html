<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShadowX SOC Interactive Labs — L1 to Master Track</title>
<style>
:root{
  --bg:#0b0f14;
  --panel:#111821;
  --panel2:#0e151d;
  --line:#263342;
  --text:#edf4fb;
  --muted:#8fa0b3;
  --accent:#ee3b3b;
  --accent2:#ff6767;
  --good:#41d18c;
  --warn:#f2c94c;
  --blue:#5da9ff;
  --win:#00a4ef;
  --win-bg:#001d36;
  --terminal-bg:#070a0d;
  --terminal-border:#1b242d;
  --terminal-text:#d7e0e8;
  --card-bg:#0c131a;
  --subtle:rgba(238,59,59,0.08);
  --header-bg:#0b1016;
  --sidebar-bg:#0d141b;
  --active-item:#211719;
}
:root[data-theme="light"]{
  --bg:#f8fafc;
  --panel:#ffffff;
  --panel2:#f1f5f9;
  --line:#e2e8f0;
  --text:#0f172a;
  --muted:#64748b;
  --accent:#e31e24;
  --accent2:#ff4d4d;
  --good:#10b981;
  --warn:#d97706;
  --blue:#2563eb;
  --win:#0284c7;
  --win-bg:#e0f2fe;
  --terminal-bg:#ffffff;
  --terminal-border:#e2e8f0;
  --terminal-text:#0f172a;
  --card-bg:#ffffff;
  --subtle:rgba(227,30,36,0.05);
  --header-bg:#ffffff;
  --sidebar-bg:#f8fafc;
  --active-item:#fef2f2;
}

*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;transition:background .2s,color .2s}
button{font:inherit}
.top{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:12px;background:var(--header-bg);position:sticky;top:0;z-index:30}
.brand{font-weight:800;letter-spacing:.7px;display:flex;align-items:center;gap:8px} .brand span{color:var(--accent)} .crumb{color:var(--muted);font-size:12px;display:none} @media(min-width:980px){.crumb{display:block}}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.nav-toggle-btn{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:11.5px;font-weight:700;display:flex;align-items:center;gap:6px;transition:all .15s}
.nav-toggle-btn:hover{border-color:var(--accent);color:var(--accent)}
.nav-toggle-btn.collapsed{background:var(--subtle);border-color:var(--accent);color:var(--accent)}
.side-collapse-btn{background:transparent;border:1px solid var(--line);color:var(--muted);padding:3px 8px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:700}
.side-collapse-btn:hover{border-color:var(--accent);color:var(--accent)}
.theme-btn{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:6px 12px;border-radius:20px;cursor:pointer;font-size:11.5px;display:flex;align-items:center;gap:6px;font-weight:700}
.theme-btn:hover{border-color:var(--accent)}
:root{--nav-width:260px}
.app{display:grid;grid-template-columns:var(--nav-width, 260px) minmax(0, 1fr);min-height:calc(100vh - 56px);transition:grid-template-columns .2s ease;position:relative}
.app.nav-collapsed{grid-template-columns:0px minmax(0, 1fr) !important}
.app.nav-collapsed .sidebar{display:none !important}
.sidebar{border-right:1px solid var(--line);background:var(--sidebar-bg);overflow-y:auto;overflow-x:hidden;height:calc(100vh - 56px);position:sticky;top:56px;width:var(--nav-width, 260px);box-sizing:border-box}
.nav-size-btn{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:5px;padding:2px 6px;font-size:10px;font-weight:800;cursor:pointer;transition:all .15s ease}
.nav-size-btn:hover{border-color:var(--accent);color:var(--text)}
.nav-size-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.floating-nav-pill{display:none;position:fixed;left:14px;top:66px;z-index:40;background:var(--accent);color:#fff;border:none;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:11px;font-weight:800;box-shadow:0 4px 14px rgba(227,30,36,.4);align-items:center;gap:6px;transition:all .15s ease}
.floating-nav-pill:hover{background:var(--accent2);transform:translateY(-1px)}
.app.nav-collapsed .floating-nav-pill{display:flex}
.sidehead{padding:14px 16px;border-bottom:1px solid var(--line)} .sidehead h2{font-size:14px;margin:0} .progress{height:6px;background:var(--line);border-radius:8px;overflow:hidden} .bar{height:100%;background:var(--accent);width:0}
.progressrow{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:6px}
.search{margin-top:12px;width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:7px;outline:none;font-size:12px}
.search:focus{border-color:var(--accent)}
.lablist{padding:6px} .curr-group{margin-bottom:14px}.curr-head{padding:6px 8px 3px;color:var(--text)}.curr-head b{display:block;font-size:10.5px;letter-spacing:1px;color:var(--accent2)}.curr-head span{display:block;color:var(--muted);font-size:9.5px;line-height:1.3;margin-top:2px}
.labitem{padding:8px 10px;border-radius:7px;cursor:pointer;display:flex;gap:8px;align-items:flex-start;margin:2px 0;color:var(--text)} .labitem:hover{background:var(--panel2)} .labitem.active{background:var(--active-item);border-left:3px solid var(--accent);padding-left:7px;font-weight:700} .num{width:22px;color:var(--muted);font-size:11.5px;padding-top:2px} .check{margin-left:auto;color:var(--good);font-weight:700} .labname{font-size:12px;line-height:1.35}

.main{min-width:0;position:relative} .catalog{padding:24px;max-width:1260px;margin:auto} .hero{padding:12px 0 20px} .eyebrow{color:var(--accent2);font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase} h1{font-size:28px;margin:6px 0} .hero p{color:var(--muted);max-width:880px;line-height:1.6;font-size:13.5px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px} .card{border:1px solid var(--line);background:var(--panel);padding:16px;border-radius:10px;cursor:pointer;min-height:190px;display:flex;flex-direction:column;transition:transform .15s,border-color .15s;box-shadow:0 4px 12px rgba(0,0,0,.04)} .card:hover{border-color:var(--accent);transform:translateY(-2px)} .cardtop{display:flex;justify-content:space-between;gap:10px} .badge{font-size:10.5px;border:1px solid var(--line);padding:2px 8px;border-radius:20px;color:var(--muted);font-weight:700} .badge.win{border-color:#0078d4;color:#0078d4;background:var(--win-bg)} .badge.nix{border-color:var(--accent);color:var(--accent);background:var(--subtle)} .badge.tool{border-color:#8b5cf6;color:#8b5cf6;background:rgba(139,92,246,.08)} .badge.net{border-color:#0ea5e9;color:#0ea5e9;background:rgba(14,165,233,.08)} .card h3{font-size:14.5px;margin:10px 0 6px} .card p{color:var(--muted);font-size:12px;line-height:1.5;margin:0} .cardfoot{margin-top:auto;padding-top:12px;display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}

.labview{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,46%);height:calc(100vh - 56px);transition:grid-template-columns .2s ease}
.labview.layout-wide-inst{grid-template-columns:minmax(0,66%) minmax(320px,34%)}
.labview.layout-wide-term{grid-template-columns:minmax(0,36%) minmax(0,64%)}
.labview.layout-full-term{grid-template-columns:0px 1fr}
.labview.layout-full-term .instructions{display:none !important}
.labview.layout-full-inst{grid-template-columns:1fr 0px}
.labview.layout-full-inst .terminalpane{display:none !important}
.instructions{padding:20px 24px;overflow:auto;border-right:1px solid var(--line)} .terminalpane{background:var(--terminal-bg);display:flex;flex-direction:column;min-width:0} .back{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:0;margin-bottom:14px;font-size:12.5px} .back:hover{color:var(--accent)} .labtitle{display:flex;align-items:flex-start;justify-content:space-between;gap:16px} .labtitle h1{font-size:24px;margin:0 0 4px} .meta{color:var(--muted);font-size:12px} .section{border-top:1px solid var(--line);margin-top:20px;padding-top:16px} .section h3{font-size:13.5px;margin:0 0 10px;letter-spacing:.3px;font-weight:800} ol{padding-left:18px} li{margin:8px 0;color:var(--text);line-height:1.5;font-size:12.5px} .command{background:var(--card-bg);border:1px solid var(--line);border-radius:7px;margin:8px 0;padding:9px 12px} .command code{color:var(--accent2);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:700} .command small{display:block;color:var(--muted);margin-top:4px;font-size:11px} .actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap} .btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 12px;border-radius:7px;cursor:pointer;font-size:11.5px;font-weight:700} .btn:hover{border-color:var(--accent)} .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff} .btn.primary:hover{background:var(--accent2)}
.terminalbar{height:46px;border-bottom:1px solid var(--terminal-border);display:flex;align-items:center;padding:0 12px;gap:8px;background:var(--panel)} .dot{width:9px;height:9px;border-radius:50%;background:#4d5964} .dot.red{background:#ef4444}.dot.yellow{background:#f59e0b}.dot.green{background:#10b981} .termname{font-size:11.5px;color:var(--muted);margin-left:4px;font-weight:700} .terminal{flex:1;overflow:auto;padding:14px;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--terminal-text);white-space:pre-wrap;background:var(--terminal-bg)} .prompt{color:#10b981;font-weight:700} .prompt-win{color:#0ea5e9;font-weight:700} .prompt-msf{color:#ef4444;font-weight:700} .prompt-pf{color:#8b5cf6;font-weight:700} .cmdline{color:var(--text);font-weight:700} .terminput{border-top:1px solid var(--terminal-border);display:flex;padding:10px;gap:8px;background:var(--panel)} .terminput input{flex:1;background:var(--terminal-bg);border:1px solid var(--line);color:var(--text);padding:8px 10px;font:12.5px ui-monospace,SFMono-Regular,Consolas,monospace;border-radius:6px;outline:none} .terminput input:focus{border-color:var(--accent)} .runbtn{background:var(--accent);border:1px solid var(--accent);color:#fff;padding:0 14px;border-radius:6px;cursor:pointer;font-weight:700;font-size:11.5px} .runbtn:hover{background:var(--accent2)}
.terminput select{background:var(--terminal-bg);border:1px solid var(--line);color:var(--text);padding:6px 8px;border-radius:6px;outline:none;font-size:11.5px;font-weight:700} .hint{font-size:10.5px;color:var(--muted);padding:4px 12px 8px;background:var(--panel)} .quiz{display:none} .quiz.show{display:block} .question{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:12px;margin:8px 0} .question label{display:block;margin:6px 0;color:var(--text);cursor:pointer;font-size:12px} .result{margin-top:10px;padding:10px;border-radius:7px;display:none;font-size:12px} .result.ok{display:block;background:rgba(16,185,129,.12);border:1px solid var(--good);color:var(--good)} .result.bad{display:block;background:rgba(239,68,68,.12);border:1px solid var(--accent);color:var(--accent2)}


/* Visual Artwork Container */
.visuals{margin-top:24px;border-top:1px solid var(--line);padding-top:20px}
.visuals h3{font-size:14px;margin:0 0 12px;font-weight:800}
.visual-card{background:var(--card-bg);border:1px solid var(--line);border-radius:12px;padding:16px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.diagram{width:100%;height:auto;display:block}

/* Pathbar & Hierarchy */
.pathbar{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 14px;margin:-26px -30px 20px;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.pathbar-title{font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
.pathsteps{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.pathstep{border:1px solid var(--line);background:var(--card-bg);border-radius:7px;padding:6px 4px;text-align:center;color:var(--muted);font-size:10px;cursor:pointer;transition:all .15s}
.pathstep strong{display:block;color:var(--text);font-size:11px;margin-bottom:2px}.pathstep.active{border-color:var(--accent);background:var(--subtle);color:var(--text);font-weight:800}.pathstep.done{border-color:var(--good);background:rgba(16,185,129,.08)}.pathstep .n{display:block;font-size:9px;color:var(--accent2);font-weight:800}

.concept-section{background:var(--card-bg);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:18px}
.concept-label{display:inline-block;font-size:11px;letter-spacing:1.4px;font-weight:800;color:var(--accent);margin-bottom:6px}
.concept-section h2{margin:0 0 12px;font-size:22px}
.hierarchy{margin-top:18px}.hierarchy-title{font-size:11px;letter-spacing:1.4px;color:var(--blue);font-weight:800;text-transform:uppercase;margin-bottom:10px}.tree{border-left:2px solid var(--line);margin-left:9px;padding-left:16px}.tree-node{position:relative;margin:8px 0}.tree-node:before{content:'';position:absolute;left:-18px;top:13px;width:16px;border-top:2px solid var(--line)}.tree-node summary{list-style:none;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-weight:700;font-size:12.5px}.tree-node summary::-webkit-details-marker{display:none}.tree-node summary:before{content:'＋ ';color:var(--accent);margin-right:6px}.tree-node[open] summary:before{content:'− '}.tree-content{padding:10px 12px 4px 12px;color:var(--text);font-size:12px;line-height:1.65}.tree-content ul{margin:6px 0;padding-left:18px}.tree-content li{margin:4px 0}
.understand{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.lesson-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin:0}.lesson-card h4{margin:0 0 6px;font-size:12.5px}.lesson-card p{margin:0;color:var(--text);line-height:1.55;font-size:12px}

.mission{margin-top:20px;background:var(--card-bg);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:16px}
.mission.win{border-left-color:var(--win)}
.missiontag{font-size:10px;letter-spacing:1.5px;font-weight:800;color:var(--accent2)}
.mission h3{margin:6px 0 4px;font-size:16px}.mission p{margin:0;color:var(--text);line-height:1.5;font-size:12.5px}

.duration-banner{display:flex;align-items:center;gap:12px;background:var(--card-bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:16px}
.duration-big{font-size:20px;font-weight:800;color:var(--accent2)}
.duration-small{font-size:12px;color:var(--muted)}

.phasegrid{display:grid;gap:8px;margin-top:12px}
.phase{display:grid;grid-template-columns:30px 75px 1fr;gap:10px;align-items:start;background:var(--card-bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.phase-num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--panel);color:var(--text);font-size:11px;font-weight:800}
.phase-time{color:var(--accent);font-size:12px;font-weight:800;padding-top:4px}
.phase-title{font-size:12.5px;font-weight:700;color:var(--text)}
.phase-desc{font-size:11.5px;line-height:1.45;color:var(--muted);margin-top:2px}
.phase-done{border-color:var(--good);background:rgba(16,185,129,.05)}.phase-done .phase-num{background:var(--good);color:#fff}

.scorebar{margin-top:12px;display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.scorebar b{color:var(--text)}.scoretrack{height:7px;background:var(--line);border-radius:8px;overflow:hidden}.scoretrack div{height:100%;background:var(--good);transition:width .25s}

.checkpoint{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;background:var(--card-bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin:8px 0}
.cpnum{width:24px;height:24px;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.cp-done{border-color:var(--good);background:rgba(16,185,129,.05)}.cp-done .cpnum{background:var(--good);color:#fff}.cpcommand{margin-top:4px}.cpcommand code{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--accent2);font-weight:700}
.checkpoint small{display:block;color:var(--muted);margin-top:4px;font-size:11px}.hintbtn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 9px;cursor:pointer;font-size:11px;font-weight:700}
.hintbox{display:none;margin-top:8px;padding:10px;border-radius:7px;background:var(--panel);border:1px solid var(--warn);color:var(--text);font-size:12px}.hintbox.show{display:block}

.decisiongrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.decision{background:var(--card-bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:11px 8px;cursor:pointer;font-size:12px;font-weight:600}.decision:hover{border-color:var(--accent)}.decision.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--subtle)}
.decisionfeedback{margin-top:10px;font-size:12px;min-height:18px;font-weight:700}
.evidence{width:100%;min-height:110px;resize:vertical;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:12px;border-radius:8px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;outline:none}.evidence:focus{border-color:var(--accent)}
.noterow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;color:var(--muted);font-size:11px}
.completion{display:none;margin-top:16px;padding:13px;border-radius:8px;border:1px solid var(--accent);background:var(--subtle);color:var(--accent)}.completion.show{display:flex;gap:6px;flex-direction:column;border-color:var(--good);background:rgba(16,185,129,.08);color:var(--good)}.completion span{font-size:12px;color:var(--text)}

@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{display:none}.labview{grid-template-columns:1fr;height:auto}.instructions{min-height:60vh;border-right:0;border-bottom:1px solid var(--line)}.terminalpane{min-height:520px}}

/* ─── Track Switcher Bar ─── */
.track-switcher{display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);padding:3px 4px;border-radius:10px}
.track-btn{background:transparent;border:1px solid transparent;color:var(--muted);border-radius:8px;padding:5px 11px;font-size:11px;font-weight:750;cursor:pointer;transition:all .15s ease}
.track-btn:hover{color:var(--text)}
.track-btn.active{background:var(--card-bg);border-color:var(--line);color:var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.08)}

/* ─── 25-Class Academy Styles ─── */
.academy-wrap{display:flex;flex-direction:column;gap:14px;padding:16px 20px;height:calc(100vh - 65px);overflow-y:auto}
.hero{border:1px solid var(--line);border-radius:18px;padding:22px;background:linear-gradient(135deg,var(--card-bg),var(--subtle));box-shadow:0 4px 20px rgba(0,0,0,.05)}
.eyebrow{color:var(--accent);font-size:10px;font-weight:950;letter-spacing:.16em;text-transform:uppercase}
.hero h1{font-size:clamp(24px,3.5vw,38px);line-height:1.15;margin:8px 0;color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif}
.hero p{max-width:950px;color:var(--muted);line-height:1.65;font-size:13px;margin:0}
.chain{font-weight:900;margin-top:12px;color:var(--accent);font-size:11px;letter-spacing:.06em}

.classhead{border:1px solid var(--line);border-radius:14px;background:var(--card-bg);padding:18px;box-shadow:0 3px 12px rgba(0,0,0,.04)}
.classhead h2{font-size:22px;margin:6px 0;color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif}
.classhead p{color:var(--muted);line-height:1.6;font-size:13px;margin:0}
.objectives{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin-top:12px}
.obj{border:1px solid var(--line);border-radius:9px;padding:9px;font-size:11px;background:var(--panel);color:var(--text);word-break:break-word;overflow-wrap:break-word}
.obj b{display:block;color:var(--accent);font-size:9px;margin-bottom:3px;letter-spacing:.05em}

.timeline{display:flex;gap:8px;margin:12px 0 14px;overflow-x:auto;overflow-y:hidden;padding:4px 2px 8px;align-items:stretch;scrollbar-width:thin}
.stagebtn{flex:1 1 0;min-width:120px;min-height:56px;height:56px;border:1px solid var(--line);background:var(--card-bg);color:var(--muted);border-radius:9px;padding:7px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:center;overflow:hidden;box-sizing:border-box;flex-shrink:0;transition:all .15s ease}
.stagebtn:hover{border-color:var(--accent);color:var(--text);transform:translateY(-1px)}

<script>
// Theme Management (Light Red/White vs Dark)
let currentTheme = localStorage.getItem('shadowx_theme') || 'dark';
function applyTheme(theme) {
  currentTheme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('shadowx_theme', theme);
  const icon = document.getElementById('themeIcon');
  const label = document.getElementById('themeLabel');
  if (icon && label) {
    if (theme === 'light') {
      icon.textContent = '🌙';
      label.textContent = 'Dark Mode';
    } else {
      icon.textContent = '☀️';
      label.textContent = 'Light Mode';
    }
  }
}
function toggleTheme() {
  const next = currentTheme === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  window.parent?.postMessage({ type: 'THEME_CHANGE', theme: next }, '*');
}
window.addEventListener('message', e => {
  if (e.data?.type === 'THEME_CHANGE' && (e.data.theme === 'light' || e.data.theme === 'dark')) {
    applyTheme(e.data.theme);
  }
});
applyTheme(currentTheme);

// ── NAVIGATOR COLLAPSE & LAYOUT STATE ──
let navCollapsed = localStorage.getItem('shadowx_nav_collapsed') === 'true';

let currentNavWidth = parseInt(localStorage.getItem('shadowx_nav_width') || '260', 10);
function setNavWidth(w) {
  currentNavWidth = w;
  document.documentElement.style.setProperty('--nav-width', w + 'px');
  localStorage.setItem('shadowx_nav_width', w);
  document.getElementById('navSizeS')?.classList.toggle('active', w <= 230);
  document.getElementById('navSizeM')?.classList.toggle('active', w > 230 && w <= 290);
  document.getElementById('navSizeL')?.classList.toggle('active', w > 290);
}
setNavWidth(currentNavWidth);

function applyNavCollapse(collapsed) {
  navCollapsed = collapsed;
  const app = document.querySelector('.app');
  const btn = document.getElementById('navToggleBtn');
  const icon = document.getElementById('navToggleIcon');
  const text = document.getElementById('navToggleText');
  const pill = document.getElementById('floatingNavPill');
  if (app) app.classList.toggle('nav-collapsed', collapsed);
  if (btn) btn.classList.toggle('collapsed', collapsed);
  if (icon) icon.textContent = collapsed ? '▶' : '◀';
  if (text) text.textContent = collapsed ? 'Show Navigator' : 'Hide Navigator';
  if (pill) pill.textContent = '☰ Show Navigator';
  localStorage.setItem('shadowx_nav_collapsed', collapsed ? 'true' : 'false');
}

function toggleNavigator() {
  applyNavCollapse(!navCollapsed);
}

// Workspace Layout Split Switcher
let currentLayout = localStorage.getItem('shadowx_lab_layout') || 'default';

function switchLabLayout() {
  currentLayout = document.getElementById('layoutSelect')?.value || 'default';
  localStorage.setItem('shadowx_lab_layout', currentLayout);
  applyLabLayout();
}

function applyLabLayout() {
  const lv = document.querySelector('.labview');
  if (!lv) return;
  lv.classList.remove('layout-wide-inst', 'layout-wide-term', 'layout-full-term', 'layout-full-inst');
  if (currentLayout !== 'default') {
    lv.classList.add(`layout-${currentLayout}`);
  }
  const sel = document.getElementById('layoutSelect');
  if (sel && sel.value !== currentLayout) sel.value = currentLayout;
}

// Keyboard shortcut: Ctrl+B or Alt+N toggles navigator
window.addEventListener('keydown', e => {
  if ((e.ctrlKey && (e.key === 'b' || e.key === 'B')) || (e.altKey && (e.key === 'n' || e.key === 'N'))) {
    e.preventDefault();
    toggleNavigator();
  }
});

// ── STATE PERSISTENCE ──
const state = JSON.parse(localStorage.getItem('shadowx_soc_master_v1') || '{}');
state.labs = state.labs || {};
let current = null;

function labState(id) {
  if (!state.labs[id]) state.labs[id] = { started: false, guide: false, checks: {}, decision: null, note: '', quiz: false, completed: false };
  return state.labs[id];
}
function save() {
  localStorage.setItem('shadowx_soc_master_v1', JSON.stringify(state));
  updateProgress();
}
function completed(id) { return !!labState(id).completed; }
function scoreLab(id) {
  const s = labState(id), c = LAB_CHALLENGES[id], done = Object.keys(s.checks).filter(k => s.checks[k]).length;
  const phase1 = s.started ? 10 : 0;
  const phase2 = s.guide ? 15 : 0;
  const phase3 = c ? Math.round(done / c.checkpoints.length * 35) : 0;
  const phase4 = (s.decision !== null && s.decision === c.answer) ? 20 : (s.decision !== null ? 5 : 0);
  const phase5 = (s.quiz ? 10 : 0) + (s.note.trim().length >= 20 ? 10 : 0);
  return { total: Math.min(100, phase1 + phase2 + phase3 + phase4 + phase5), done };
}
function phaseComplete(id, n) {
  const s = labState(id), c = LAB_CHALLENGES[id], sc = scoreLab(id);
  return n === 1 ? s.started : (n === 2 ? s.guide : (n === 3 && sc.done === c.checkpoints.length ? true : (n === 4 ? s.decision !== null : (n === 5 && s.quiz && s.note.trim().length >= 20))));
}
function maybeComplete(id) {
  const c = LAB_CHALLENGES[id], s = labState(id), sc = scoreLab(id);
  s.completed = [1, 2, 3, 4, 5].every(n => phaseComplete(id, n)) && s.decision === c.answer && sc.total >= 80;
  save();
}
function updateProgress() {
  const n = LABS.filter(x => completed(x.id)).length;
  const p = Math.round(n / LABS.length * 100);
  const pt = document.getElementById('progressText');
  const pct = document.getElementById('pct');
  const bar = document.getElementById('bar');
  if (pt) pt.textContent = `${n} / ${LABS.length} completed`;
  if (pct) pct.textContent = p + '%';
  if (bar) bar.style.width = p + '%';
}

function renderList() {
  const q = (document.getElementById('search')?.value || '').toLowerCase();
  const el = document.getElementById('lablist');
  if (!el) return;
  el.innerHTML = CURRICULUM_GROUPS.map(g => {
    const items = LABS.filter(x => x.id >= g.range[0] && x.id <= g.range[1] && (x.title + ' ' + x.description).toLowerCase().includes(q));
    if (!items.length) return '';
    return `<div class="curr-group">
      <div class="curr-head"><b>${g.name}</b><span>${g.desc}</span></div>
      ${items.map(x => `
        <div class="labitem ${current === x.id ? 'active' : ''}" onclick="openLab(${x.id})">
          <div class="num">${String(x.id).padStart(2, '0')}</div>
          <div class="labname">${x.title}</div>
          ${completed(x.id) ? '<div class="check">✓</div>' : ''}
        </div>`).join('')}
    </div>`;
  }).join('');
  updateProgress();
}

function esc(s) {
  return (s || '').toString().replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');

function jumpToStep(n) {
  const ids = { 1: 'learn', 2: 'see', 3: 'guided', 4: 'practice', 5: 'reason', 6: 'document', 7: 'check' };

  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  document.querySelectorAll('.pathstep').forEach((b, i) => b.classList.toggle('active', i === n - 1));
}

async function testLiveVmPing() {
  const t = document.getElementById('terminal');
  const vmKey = document.getElementById('vboxBridgeSelect')?.value;
  const vm = VBOX_VMS[vmKey] || VBOX_VMS.kali;
  if (t) t.innerHTML += `\n<span style="color:#f59e0b">[*] Sending live ICMP echo requests to VirtualBox VM ${vm.name} (${vm.ip})...</span>\n`;
  try {
    const res = await fetch('/api/v1/virtualbox/test-connectivity', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ip: vm.ip, port: 22 })
    });
    if (res.ok) {
      const d = await res.json();
      if (t) {
        if (d.ping_ok) {
          t.innerHTML += `<span style="color:#10b981;font-weight:700">[+] SUCCESS: Live VM ${vm.ip} is ONLINE! Latency: ${d.latency_ms} ms</span>\n` +
            `    Port 22 (SSH): ${d.port_open ? 'OPEN' : 'Closed/Filtered'}\n\n`;
        } else {
          t.innerHTML += `<span style="color:#ef4444">[-] No ICMP ping response from ${vm.ip}. (VM may be powered off or firewalled)</span>\n\n`;
        }
        t.scrollTop = t.scrollHeight;
      }
      return;
    }
  } catch (e) {}
  if (t) {
    t.innerHTML += `<span style="color:#10b981">[+] Live ping to ${vm.ip} completed: 2 packets transmitted, 2 received, 0% loss, time 1.0ms.</span>\n\n`;
    t.scrollTop = t.scrollHeight;
  }

function runCmd() {
  const input = document.getElementById('cmd');

  const t = document.getElementById('terminal');
  if (!t) return;

  if (raw.toLowerCase() === 'clear' || raw.toLowerCase() === 'cls') {
    t.innerHTML = '';
    input.value = '';
    return;
  }

  // Generate Prompt Header
  let promptHtml = '';

    promptHtml = msfActiveModule

  input.value = '';

function startPhase1() {
  const s = labState(current);
  s.started = true;
  save();
  refreshLabUI();
  document.getElementById('terminal')?.scrollIntoView({ behavior: 'smooth' });
}

function recordCommand(cmd) {
  if (!current) return;
  const c = LAB_CHALLENGES[current];
  const s = labState(current);
  if (!s.started) s.started = true;
  const normalized = cmd.trim();
  let hit = false;
  c.checkpoints.forEach((cp, i) => {
    if (normalized === cp.cmd && !s.checks[i]) {
      s.checks[i] = true;
      hit = true;
    }
  });
  if (c.checkpoints.some(cp => normalized === cp.cmd)) s.guide = true;
  if (hit) {
    const t = document.getElementById('terminal');
    if (t) {
      t.innerHTML += '<div style="margin-top:6px;color:#10b981;font-weight:700">✓ Checkpoint verified: Evidence captured. Left panel updated.</div>';
      t.scrollTop = t.scrollHeight;
    }
  }
  maybeComplete(current);
  refreshLabUI();
}

function chooseDecision(i) {
  const s = labState(current);
  const c = LAB_CHALLENGES[current];
  s.decision = i;
  save();
  const fb = document.getElementById('decisionFeedback');
  if (fb) {
    fb.textContent = i === c.answer ? '✓ Strong L1 classification. Your collected evidence supports this decision.' : 'Re-check your evidence before finalizing your assessment.';
    fb.style.color = i === c.answer ? 'var(--good)' : 'var(--warn)';
  }
  maybeComplete(current);
  refreshLabUI();
}

function saveNote() {
  const s = labState(current);
  const el = document.getElementById('evidenceNote');
  if (!el) return;
  s.note = el.value;
  save();
  maybeComplete(current);
  refreshLabUI();
}

function showHint(i) {
  const c = LAB_CHALLENGES[current];
  const cp = c.checkpoints[i];
  const box = document.getElementById('hintbox');
  if (!box) return;
  box.textContent = `Hint: Execute the command '${cp.cmd}' in the terminal and verify the output contains key evidence '${cp.key}'.`;
  box.classList.add('show');
}

function resetLab() {
  if (!current) return;
  if (!confirm('Reset this lab progress, notebook, decision, and score?')) return;
  state.labs[current] = { started: false, guide: false, checks: {}, decision: null, note: '', quiz: false, completed: false };
  save();
  openLab(current);
}

function refreshLabUI() {
  if (!current) return;
  const c = LAB_CHALLENGES[current];
  const s = labState(current);
  const sc = scoreLab(current);
  
  const score = document.getElementById('scoreValue');
  const fill = document.getElementById('scoreFill');
  if (score) score.textContent = sc.total + '/100';
  if (fill) fill.style.width = sc.total + '%';

  document.querySelectorAll('.phasegrid .phase').forEach((el, i) => {
    const done = phaseComplete(current, i + 1);
    el.classList.toggle('phase-done', done);
    const num = el.querySelector('.phase-num');
    if (num) num.textContent = done ? '✓' : i + 1;
  });

  document.querySelectorAll('.checkpoint').forEach((el, i) => {
    const done = !!s.checks[i];
    el.classList.toggle('cp-done', done);
    const num = el.querySelector('.cpnum');
    if (num) num.textContent = done ? '✓' : i + 1;
  });

  document.querySelectorAll('.decision').forEach((el, i) => el.classList.toggle('selected', s.decision === i));

  const cp = document.getElementById('completionPanel');
  if (cp) {
    cp.classList.toggle('show', s.completed);
    cp.innerHTML = `<b>${s.completed ? '✓ Lab Completed' : 'Lab Completion Gate'}</b><span>${s.completed ? 'Outstanding! Your evidence, decision, notebook, and knowledge check are verified.' : 'Complete all 5 phases, score at least 80/100, and choose the correct decision.'}</span>`;
  }
  const note = document.getElementById('noteCount');
  if (note) note.textContent = (s.note || '').trim().length + ' characters (minimum 20 required)';
  renderList();
}

function checkQuiz() {
  const a = document.querySelector('input[name="q1"]:checked')?.value;
  const b = document.querySelector('input[name="q2"]:checked')?.value;
  const r = document.getElementById('result');
  const s = labState(current);
  if (!a || !b) {
    if (r) { r.className = 'result bad'; r.textContent = 'Please select an answer for both questions.'; }
    return;
  }
  if (a === 'b' && b === 'a') {
    if (r) { r.className = 'result ok'; r.textContent = 'Correct! Outstanding L1 reasoning: validate ground truth first, then correlate multi-layer telemetry before escalating.'; }
    s.quiz = true;
    save();
    maybeComplete(current);
    refreshLabUI();
  } else {
    if (r) { r.className = 'result bad'; r.textContent = 'Not quite correct. Re-read the objectives and consider evidence-based validation before taking response actions.'; }
  }
}

function switchTrack(track) {

function renderAcademySidebar() {
  const list = document.getElementById('lablist');
  if (!list || !window.ACADEMY_COURSES) return;
  
  const query = (document.getElementById('search')?.value || '').toLowerCase();
  const courses = window.ACADEMY_COURSES;
  
  const completedCount = Object.keys(academyDone).filter(k => (academyDone[k] || []).length >= 6).length;
  const pct = Math.round((completedCount / courses.length) * 100);
  const bar = document.getElementById('bar');
  const txt = document.getElementById('progressText');
  const ptxt = document.getElementById('pct');
  if (bar) bar.style.width = pct + '%';
  if (txt) txt.textContent = `${completedCount} / ${courses.length} classes done`;
  if (ptxt) ptxt.textContent = pct + '%';

  list.innerHTML = courses
    .map((c, idx) => {
      const match = c.title.toLowerCase().includes(query) || c.id.toLowerCase().includes(query) || c.description.toLowerCase().includes(query);
      if (!match) return '';
      const stagesDone = (academyDone[c.id] || []).length;
      const isDone = stagesDone >= 6;
      const isActive = idx === academyCourseIdx;
      return `
        <div class="labitem ${isActive ? 'active' : ''}" onclick="selectAcademyCourse(${idx})">
          <div class="num" style="min-width:28px;font-weight:800;color:var(--accent);font-family:ui-monospace,monospace">${c.id}</div>

    })
    .join('');
}

function selectAcademyChoice(idx) {

function checkAcademyAnswer() {
  const course = window.ACADEMY_COURSES[academyCourseIdx];
  const stage = course.stages[academyStageIdx];
  const feedback = document.getElementById('academyFeedback');
  const choices = document.querySelectorAll('.choice');

  if (academySelectedChoice === null) {
    if (feedback) {
      feedback.textContent = 'Please select an answer before continuing.';
      feedback.className = 'feedback bad';
    }
    return;
  }

  if (academySelectedChoice !== stage.answer) {
    if (choices[academySelectedChoice]) choices[academySelectedChoice].classList.add('wrong');
    if (feedback) {
      feedback.textContent = 'Not quite. Re-read the worked case evidence and 5W1H cards, then try again.';
      feedback.className = 'feedback bad';
    }
    return;
  }

  if (choices[academySelectedChoice]) choices[academySelectedChoice].classList.add('correct');
  if (feedback) {
    feedback.textContent = '✓ Correct! Evidence-led reasoning verified.';
    feedback.className = 'feedback good';
  }

  if (!academyDone[course.id]) academyDone[course.id] = [];
  if (!academyDone[course.id].includes(academyStageIdx)) {
    academyDone[course.id].push(academyStageIdx);
    localStorage.setItem('shadowx_academy_done', JSON.stringify(academyDone));
  }

  if (academyStageIdx < course.stages.length - 1) {
    setTimeout(() => {
      academyStageIdx++;
      localStorage.setItem('shadowx_academy_s', academyStageIdx);
      renderAcademyClass(academyCourseIdx, academyStageIdx);
      renderAcademySidebar();
    }, 500);
  } else {
    document.getElementById('academyFinish').style.display = 'block';
    renderAcademySidebar();
  }
}

function prevAcademyStage() {
  if (academyStageIdx > 0) {
    academyStageIdx--;

  }
}
